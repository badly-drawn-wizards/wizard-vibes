<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wizard</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a1a; overflow: hidden; }
  canvas#view { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script type="module">
  import init from "./pkg/wizard.js";
  await init();
  // (the dev server reloads the page when the app is rebuilt; a static
  // site has no events, and the 404 ends the stream)
  new EventSource("events").addEventListener("reload", () => location.reload());
</script>
</body>
</html>
