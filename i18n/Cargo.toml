[package]
name = "wizard-i18n"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The client's words, compiled in: #[langs(\"lang.json\")] on a trait implements it for each language in the file"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
