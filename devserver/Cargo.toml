[package]
name = "wizard-dev"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The dev server: rebuilds the shader and the web app on changes, serves them, and tells the app"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
