<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futhark Wizard</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --fg: #d8d4ff; --dim: #8a86b8; --bg: #05040d; --err: #ff8a9a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
           cursor: grab; touch-action: none; image-rendering: auto; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; top: 12px; left: 12px; display: flex; gap: 12px; align-items: center;
         background: rgb(5 4 13 / 0.6); padding: 6px 10px; border-radius: 6px; backdrop-filter: blur(4px); }
  #hud button { font: inherit; color: var(--dim); background: none; border: 1px solid #2c2950;
                border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  #hud button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
  #hud button:disabled { opacity: 0.35; cursor: not-allowed; }
  /* the parameter drawer, on the right */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 100vw); box-sizing: border-box;
            overflow-y: auto; padding: 48px 12px 12px; background: rgb(5 4 13 / 0.85);
            backdrop-filter: blur(6px); border-left: 1px solid #2c2950;
            transform: translateX(100%); transition: transform 0.2s; }
  .drawer-open #drawer { transform: none; }
  #drawer-toggle { position: fixed; top: 12px; right: 12px; z-index: 1; font: inherit; color: var(--fg);
                   background: rgb(5 4 13 / 0.6); border: 1px solid #2c2950; border-radius: 6px;
                   padding: 4px 10px; cursor: pointer; }
  #drawer details { margin-bottom: 6px; }
  #drawer details details { margin: 2px 0 4px 12px; }
  #drawer summary { cursor: pointer; color: var(--fg); padding: 4px 0; }
  #drawer details details > summary { color: var(--dim); }
  #drawer details[open] > summary { color: var(--fg); }
  #drawer summary span { display: inline-block; width: calc(100% - 36px); }
  #drawer summary button { font: inherit; color: var(--dim); background: none; border: none; cursor: pointer; padding: 0; }
  #drawer summary button:hover { color: var(--fg); }
  .drawer-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; color: var(--dim); }
  .drawer-bar button { font: inherit; color: var(--fg); background: none; border: 1px solid #2c2950;
                       border-radius: 4px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
  .drawer-bar button:hover { border-color: var(--fg); }
  #drawer textarea.export { width: 100%; height: 160px; box-sizing: border-box; margin-bottom: 10px; font: inherit;
                            font-size: 11px; color: var(--fg); background: #0b0a1c; border: 1px solid #2c2950; }
  .param { display: grid; grid-template-columns: 1fr 120px 44px 20px; gap: 6px; align-items: center;
           color: var(--dim); padding: 2px 0 2px 12px; }
  .param input[type=range], .param select { width: 100%; accent-color: var(--fg); }
  .param input[type=color] { width: 100%; height: 22px; padding: 0; border: none; background: none; }
  .param select { font: inherit; color: var(--fg); background: #0b0a1c; border: 1px solid #2c2950; }
  .param output { text-align: right; font-variant-numeric: tabular-nums; }
  .param button { font: inherit; color: var(--dim); background: none; border: none; cursor: pointer; padding: 0; }
  .param button:hover { color: var(--fg); }
  .param.wide { grid-template-columns: 1fr 20px; }
  .param.wide .flags { grid-column: 1; display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .param.wide .flags label { display: flex; gap: 4px; align-items: center; }
  .param.wide button { grid-row: 1; grid-column: 2; }
  /* the controls panel, bottom right (beside the drawer when it is open) */
  #help, #help-open { position: fixed; right: 12px; bottom: 12px; transition: right 0.2s; }
  .drawer-open #help, .drawer-open #help-open { right: calc(min(320px, 100vw) + 12px); }
  #help { width: 270px; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 10px 12px;
          background: rgb(5 4 13 / 0.75); backdrop-filter: blur(6px); border: 1px solid #2c2950;
          border-radius: 8px; color: var(--dim); font-size: 12px; }
  #help[hidden], #help-open[hidden] { display: none; }
  #help header { display: flex; justify-content: space-between; color: var(--fg); margin-bottom: 6px; }
  #help button, #help-open { font: inherit; color: var(--dim); background: none; border: none; cursor: pointer; padding: 0; }
  #help button:hover, #help-open:hover { color: var(--fg); }
  #help-open { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #2c2950;
               background: rgb(5 4 13 / 0.6); color: var(--fg); }
  .help-body { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .help-body > div:nth-child(even) { text-align: right; white-space: nowrap; }
  .help-spells { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #2c2950; }
  .help-spells .on { color: var(--fg); }
  .help-spells .on::after { content: " ◂"; }
  #help kbd { display: inline-block; min-width: 1.4em; padding: 0 4px; margin-left: 2px; text-align: center;
              border: 1px solid #4a4680; border-bottom-width: 2px; border-radius: 4px; color: var(--fg);
              font: inherit; font-size: 11px; }
  .glyph { display: inline-flex; align-items: center; justify-content: center; margin-left: 2px; color: #fff;
           font-size: 10px; font-weight: bold; height: 18px; vertical-align: middle; }
  .glyph.face { width: 18px; border-radius: 50%; }
  .glyph.face.A { background: #3f9c35; } .glyph.face.B { background: #c8352e; }
  .glyph.face.X { background: #2c6fd1; } .glyph.face.Y { background: #c9a227; color: #222; }
  .glyph.shoulder { padding: 0 5px; border-radius: 9px 9px 4px 4px; background: #3a3760; }
  .glyph.stick { width: 18px; border-radius: 50%; background: #3a3760; box-shadow: inset 0 0 0 3px #26244a; }
  #error { position: fixed; left: 12px; right: 12px; bottom: 12px; max-height: 50vh; overflow: auto;
           margin: 0; padding: 12px; background: rgb(20 4 10 / 0.9); color: var(--err);
           border: 1px solid var(--err); border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <span id="status">loading…</span>
  <span id="scale">
    <button data-scale="0.25">¼</button><button data-scale="0.5">½</button><button data-scale="1">1×</button>
  </span>
  <span id="backend">
    <button data-backend="webgpu">WebGPU</button><button data-backend="webgl">WebGL</button>
  </span>
</div>
<button id="drawer-toggle" type="button" title="Parameters">⚙</button>
<aside id="drawer"><div id="params"></div></aside>
<section id="help" aria-label="Controls">
  <header><span>Controls</span><button class="help-close" type="button" title="Hide">✕</button></header>
  <div class="help-body"></div>
  <div class="help-spells"></div>
</section>
<button id="help-open" type="button" title="Controls" hidden>?</button>
<pre id="error" hidden></pre>
<script type="module" src="web/main.js"></script>
</body>
</html>
