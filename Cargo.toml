# The app (client: native and web) and its dev server. The rust-gpu shader
# port (native/shader, native/shader-builder) builds apart, with rust-gpu's
# own nightly.
[workspace]
resolver = "3"
members = ["client", "devserver", "i18n"]
# (built apart, by native/shader-builder with rust-gpu)
exclude = ["native"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
debug = false

# (the app's own code is light; its dependencies (egui, wgpu, naga) are
# what make a debug build crawl; their debug info, what makes its link
# crawl: ours keeps its own)
[profile.dev.package."*"]
opt-level = 2
debug = false

# dx serve --hotpatch's own (as dev): its own build directory
# (target/hotpatch), so a cargo build, run or test, which share dev's, never
# leaves the app built ahead of it; else cargo has nothing to link, and dx
# none of the link to capture ("Missing linker args for fat link")
[profile.hotpatch]
inherits = "dev"
