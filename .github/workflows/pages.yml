# Builds the static site (the app for the web, with its shader built for the
# default settings and each quality level: wizard-dev --static) and publishes
# it to GitHub Pages. Enable it once under Settings > Pages > Source: GitHub
# Actions. The toolchain comes from the flake.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native/shader-builder/target
          key: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'native/shader-builder/Cargo.lock') }}

      - name: Build the static site
        run: nix develop -c cargo run --release -p wizard-dev -- --static dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
