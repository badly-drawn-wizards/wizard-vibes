# Builds the static site (npm run build:static) and publishes it to GitHub
# Pages. Enable it once under Settings > Pages > Source: GitHub Actions.
#
# The toolchain comes from the flake. Futhark's WebGPU branch has no binary
# cache, so the first run compiles it from source (expect most of an hour);
# the Nix store is cached between runs, keyed on flake.lock, so later runs
# only build the shader and the page.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache emscripten ports (emdawnwebgpu)
        uses: actions/cache@v4
        with:
          path: .emcache
          key: emcache-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Toolchain
        run: nix develop -c sh -c 'futhark --version && emcc --version | head -1'

      - name: Dependencies
        run: nix develop -c npm ci

      - name: Build the static site
        run: nix develop -c npm run build:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
